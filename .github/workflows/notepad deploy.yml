name: CI/CD Docker Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Login ke Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 3. Build Docker Image
    - name: Build Docker Image
      run: |
        docker build -t gamine1/vascodagama .

    # 4. Push ke Docker Hub
    - name: Push Docker Image
      run: |
        docker push gamine1/vascodagama

    # 5. Deploy ke EC2 via SSH
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: 3.219.31.123
        username: ubuntu
        key: ${{ secrets.AWS_PRIVATE_KEY }}
        script: |
          docker pull gamine1/vascodagama
          docker stop compro || true
          docker rm compro || true
          docker run -d -p 80:80 --name compro gamine1/vascodagama